:root{
  /* Paleta ExDev */
  --purple:#65428A;      /* PurpleDev */
  --cyan:#0097A9;        /* CyanDev */
  --grad:linear-gradient(135deg,#0097A9 0%,#65428A 100%); /* DegreeDev */
  --white:#FAFAFA;       /* WhiteDev */
  --dark:#1E1E1E;       /* DarkDev */
  --cream:#EEEEEE;       /* CreamDev: texto en modo oscuro */
  --gray:#333333;        /* GrayDev */
  --sec:#DDDDDD;         /* Secondary-Text (Dark) */
  /* Institucionales UTEM (uso puntual) */
  --utem-green:#78BF26;
  /* Neutros derivados para superficies */
  --surface:#272727;
  --surface-2:#303030;
  --line:#3B3B3B;
  --muted:#A9A9A9;
  --warn:#E8A33D;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--dark);overflow:hidden;cursor:none}
body{font-family:'Roboto',system-ui,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
h1,h2,h3,.inter{font-family:'Inter',system-ui,sans-serif}

#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  padding:40px 48px 40px;display:flex;flex-direction:column;gap:28px;background:var(--dark)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(900px 500px at 8% -10%,rgba(0,151,169,.16),transparent 70%),
   radial-gradient(900px 600px at 100% 110%,rgba(101,66,138,.20),transparent 70%)}
#stage>*{position:relative}

/* ---------- Header ---------- */
header{height:112px;display:flex;align-items:center;justify-content:space-between}
.brand img{height:100px;display:block}
.hdr-right{display:flex;align-items:center;gap:40px}
.clock{text-align:right}
#time{font-family:'Inter';font-weight:800;font-size:92px;line-height:1;letter-spacing:-.02em;color:var(--white);font-variant-numeric:tabular-nums}
#date{font-size:28px;color:var(--sec);margin-top:6px}
.demo-badge{display:none;font-family:'Inter';font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 16px;border-radius:999px;border:1.5px solid var(--warn);color:var(--warn)}
.demo-badge.on{display:block}

/* ---------- Layout ---------- */
main{display:grid;grid-template-columns:560px minmax(0,1fr) 520px;gap:28px;height:776px}
.col{display:flex;flex-direction:column;gap:24px;min-height:0;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:24px 28px;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.card-h{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex:none}
.ico{width:44px;height:44px;border-radius:14px;background:var(--grad);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px;stroke:var(--white);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card-h h2{font-weight:600;font-size:25px;letter-spacing:.09em;text-transform:uppercase;color:var(--sec);flex:1}
.pill{font-family:'Inter';font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:6px 14px;border-radius:999px;background:var(--surface-2);color:var(--sec);white-space:nowrap}
.pill.live{background:rgba(120,191,38,.16);color:var(--utem-green)}
.pill.off{color:var(--muted)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--muted);font-size:24px;padding:0 20px}
.empty img{height:84px;opacity:.9}

/* ---------- Música ---------- */
.music{height:360px}
.music-body{display:flex;gap:26px;flex:1;min-height:0}
.art{width:188px;height:188px;border-radius:22px;flex:none;background:var(--grad);display:grid;place-items:center;overflow:hidden;position:relative}
.art img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art img.iso{width:96px;opacity:.9}
.meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.track{font-family:'Inter';font-weight:700;font-size:36px;line-height:1.12;color:var(--white);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.artist{font-weight:500;font-size:27px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album{font-size:21px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq{display:flex;gap:5px;align-items:flex-end;height:30px;margin-top:8px}
.eq i{display:block;width:6px;height:8px;border-radius:3px;background:var(--grad);transform-origin:bottom}
.eq.on i{animation:eq 1s ease-in-out infinite}
.eq.on i:nth-child(2){animation-delay:-.4s}.eq.on i:nth-child(3){animation-delay:-.2s}.eq.on i:nth-child(4){animation-delay:-.7s}.eq.on i:nth-child(5){animation-delay:-.1s}
@keyframes eq{0%,100%{height:8px}50%{height:30px}}
.prog{display:flex;align-items:center;gap:16px;margin-top:16px;font-size:21px;color:var(--sec);font-variant-numeric:tabular-nums;flex:none}
.bar{flex:1;height:8px;border-radius:4px;background:var(--gray);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:4px;transition:width .9s linear}
.livebar{height:28px;gap:12px;color:var(--sec)}
.livebar .dot{width:12px;height:12px;border-radius:50%;background:var(--utem-green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- Sala ---------- */
.room{flex:1}
.room-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:0}
.count{font-family:'Inter';font-weight:800;font-size:168px;line-height:1;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.count.stale{background:none;color:#5b5b5b}
.count-label{font-size:30px;color:var(--cream);margin-top:-4px}
.dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:460px}
.dots i{width:28px;height:28px;border-radius:50%;background:var(--gray)}
.dots i.on{background:var(--grad)}
.updated{font-size:20px;color:var(--muted)}

/* ---------- Eventos ---------- */
.events{flex:1}
.ev-list{display:flex;flex-direction:column;gap:10px;min-height:0}
.ev{flex:0 0 96px;display:flex;align-items:center;gap:22px;background:var(--surface-2);border-radius:20px;padding:12px 22px 12px 14px;border:1.5px solid transparent}
.ev.next{background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,var(--grad) border-box}
.ev .d{width:74px;height:72px;border-radius:16px;background:var(--dark);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.ev.next .d{background:var(--grad)}
.ev .d b{font-family:'Inter';font-weight:800;font-size:34px;line-height:1;color:var(--white)}
.ev .d span{font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--sec);margin-top:3px}
.ev .t{flex:1;min-width:0}
.ev .t h3{font-weight:600;font-size:29px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .t p{font-size:21px;color:var(--sec);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .when{font-family:'Inter';font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.ev.next .when{color:var(--cream)}

/* ---------- Personas ---------- */
.bd{height:408px}
.mb{height:344px}
.rows{display:flex;flex-direction:column;gap:8px;min-height:0}
.row{display:flex;align-items:center;gap:16px;height:56px}
.av{width:48px;height:48px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-family:'Inter';font-weight:700;font-size:19px;color:var(--white);flex:none}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-family:'Inter';font-weight:600;font-size:25px;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n span{display:block;font-size:19px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .tag{font-family:'Inter';font-weight:600;font-size:18px;letter-spacing:.04em;color:var(--cyan);white-space:nowrap}
.row.today .tag{color:var(--white);background:var(--grad);padding:6px 14px;border-radius:999px}
.row.today .n b{color:var(--white)}

/* ---------- Footer ---------- */
footer{height:56px;display:flex;align-items:center;justify-content:space-between}
.wm{height:44px;opacity:.95}
.status{display:flex;gap:26px;align-items:center;font-size:20px;color:var(--muted)}
.status span{display:flex;align-items:center;gap:10px}
.status i{width:12px;height:12px;border-radius:50%;background:#555;display:block}
.status .ok i{background:var(--utem-green)}
.status .err i{background:var(--warn)}
.status .err{color:var(--warn)}
@media (prefers-reduced-motion:reduce){.eq.on i{animation:none;height:18px}.bar i{transition:none}}
</style>
</head>

const fmtParts = (d, opts) => new Intl.DateTimeFormat(CONFIG.locale, {timeZone: CONFIG.tz, ...opts}).format(d);
const dayKey = d => new Intl.DateTimeFormat('en-CA', {timeZone: CONFIG.tz}).format(d); // YYYY-MM-DD
const dayDiff = (d, now=new Date()) => Math.round((Date.UTC(...dayKey(d).split('-').map((v,i)=>i===1?v-1:+v)) - Date.UTC(...dayKey(now).split('-').map((v,i)=>i===1?v-1:+v))) / 864e5);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mmss = s => { s = Math.max(0, Math.floor(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const initials = n => { const p = String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase(); };
const relDays = n => n===0 ? 'Hoy' : n===1 ? 'Mañana' : n>1 ? `En ${n} días` : `Hace ${-n} días`;
const ago = iso => {
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s < 3600) return `hace ${Math.max(1,Math.round(s/60))} min`;
  if (s < 86400) return `hace ${Math.round(s/3600)} h`;
  const d = Math.floor(s/86400);
  if (d < 31) return d === 1 ? 'hace 1 día' : `hace ${d} días`;
  const m = Math.floor(d/30);
  return m < 12 ? (m === 1 ? 'hace 1 mes' : `hace ${m} meses`) : (Math.floor(m/12) === 1 ? 'hace 1 año' : `hace ${Math.floor(m/12)} años`);
};

/* ------------------------------ render ------------------------------ */
let DATA = null, DEMO = false, BRIDGE_OK = false;

function renderMusic(m, src){
  const el = $('music');
  const playing = m && m.state === 'playing', paused = m && m.state === 'paused';
  // Directo: el puente lo marca; si no, se deduce de una duración absurda (> 12 h)
  const live = !!m && (m.live === true || +m.duration > 43200);
  let pill = '<span class="pill off">Sin música</span>';
  if (playing) pill = `<span class="pill live">${live ? 'En vivo' : 'Sonando'}</span>`;
  else if (paused) pill = '<span class="pill">En pausa</span>';
  if (src === 'error') pill = '<span class="pill off">Sin conexión</span>';
  if (!m || !(playing || paused) || !m.title){
    el.innerHTML = head('music','Música en vivo', pill) +
      `<div class="empty"><img src="${ISO_LOGO}" alt=""><div>${src==='off' ? 'Música no configurada' : src==='error' ? 'No se pudo consultar Home Assistant' : 'No hay nada sonando en la sala'}</div></div>`;
    return;
  }
  const art = m.art ? `<img class="cover" src="${esc(m.art)}" alt="" onerror="this.remove()">` : '';
  el.innerHTML = head('music','Música en vivo', pill) + `
    <div class="music-body">
      <div class="art"><img class="iso" src="${ISO_LOGO}" alt="">${art}</div>
      <div class="meta">
        <div class="track">${esc(m.title)}</div>
        ${m.artist ? `<div class="artist">${esc(m.artist)}</div>` : ''}
        ${m.album ? `<div class="album">${esc(m.album)}</div>` : ''}
        <div class="eq ${playing ? 'on' : ''}"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    ${live
      ? '<div class="prog livebar"><span class="dot"></span><span>Transmisión en vivo</span></div>'
      : '<div class="prog"><span id="pPos">0:00</span><div class="bar"><i id="pBar"></i></div><span id="pDur">0:00</span></div>'}`;
  tickProgress();
}
function tickProgress(){
  const m = DATA && DATA.music; if (!m || !$('pBar')) return;
  const dur = +m.duration || 0; let pos = +m.position || 0;
  if (m.state === 'playing' && m.position_at) pos += (Date.now() - new Date(m.position_at).getTime())/1000;
  if (dur) pos = Math.min(pos, dur);
  $('pPos').textContent = mmss(pos);
  $('pDur').textContent = dur ? mmss(dur) : '--:--';
  $('pBar').style.width = dur ? (100*pos/dur).toFixed(1) + '%' : '0%';
}

function renderRoom(r, src){
  const el = $('room');
  if (!r || src === 'off' || src === 'error'){
    el.innerHTML = head('users','En la sala', `<span class="pill off">${src==='off'?'Sin configurar':'Sin conexión'}</span>`) +
      `<div class="empty"><img src="${ISO_LOGO}" alt=""><div>${src==='off' ? 'El contador de personas aún no está conectado' : 'No se pudo leer el contador'}</div></div>`;
    return;
  }
  const age = (Date.now() - new Date(r.ts).getTime())/1000, stale = !(age <= CONFIG.roomStaleSec);
  const n = Math.max(0, parseInt(r.count) || 0);
  const dots = Array.from({length: CONFIG.capacity}, (_, i) => `<i class="${!stale && i < n ? 'on' : ''}"></i>`).join('');
  el.innerHTML = head('users','En la sala', stale ? '<span class="pill off">Sin señal</span>' : '<span class="pill live">En vivo</span>') + `
    <div class="room-body">
      <div class="count ${stale ? 'stale' : ''}">${stale ? '–' : n}</div>
      <div class="count-label">${stale ? 'sin señal del contador' : n === 1 ? 'persona en la sala' : 'personas en la sala'}</div>
      <div class="dots">${dots}</div>
      <div class="updated">${stale ? 'Último dato ' + ago(r.ts) : 'Actualizado hace ' + Math.max(1, Math.round(age)) + ' s'}</div>
    </div>`;
}

function renderEvents(list, src){
  const el = $('events');
  const pill = src === 'error' ? '<span class="pill off">Sin conexión</span>' : '';
  const evs = (list || []).slice(0, CONFIG.maxEvents);
  if (!evs.length){
    el.innerHTML = head('cal','Próximos eventos', pill) +
      `<div class="empty"><img src="${ISO_LOGO}" alt=""><div>${src==='off' ? 'Calendario no configurado' : src==='error' ? 'No se pudo leer el calendario' : 'No hay eventos programados por ahora'}</div></div>`;
    return;
  }
  el.innerHTML = head('cal','Próximos eventos', pill) + '<div class="ev-list">' + evs.map((e, i) => {
    // Los eventos de día completo llegan como "YYYY-MM-DD": se fijan a mediodía UTC para que no cambien de día al mostrarse
    const s = new Date(e.all_day ? e.start + 'T12:00:00Z' : e.start), en = e.end ? new Date(e.all_day ? e.end + 'T12:00:00Z' : e.end) : null;
    const diff = dayDiff(s);
    let hora = 'Todo el día';
    if (!e.all_day){
      hora = fmtParts(s, {hour:'2-digit', minute:'2-digit', hour12:false});
      if (en) hora += ' – ' + fmtParts(en, {hour:'2-digit', minute:'2-digit', hour12:false});
    }
    const meta = [hora, e.location].filter(Boolean).map(esc).join(' · ');
    return `<div class="ev ${i===0 ? 'next' : ''}">
      <div class="d"><b>${fmtParts(s,{day:'numeric'})}</b><span>${esc(fmtParts(s,{month:'short'}).replace('.',''))}</span></div>
      <div class="t"><h3>${esc(e.title || 'Evento')}</h3><p>${meta}</p></div>
      <div class="when">${esc(relDays(diff))}</div></div>`;
  }).join('') + '</div>';
}

function renderBirthdays(list, src){
  const el = $('bd');
  const pill = src === 'error' ? '<span class="pill off">Sin conexión</span>' : '';
  const items = (list || []).slice(0, CONFIG.maxBirthdays);
  if (!items.length){
    el.innerHTML = head('cake','Próximos cumpleaños', pill) +
      `<div class="empty"><div>${src==='off' ? 'Notion no configurado' : src==='error' ? 'No se pudo leer Notion' : 'No hay cumpleaños próximos'}</div></div>`;
    return;
  }
  const mes = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  el.innerHTML = head('cake','Próximos cumpleaños', pill) + '<div class="rows">' + items.map(b => `
    <div class="row ${b.days===0 ? 'today' : ''}">
      <div class="av">${esc(initials(b.name))}</div>
      <div class="n"><b>${esc(b.name)}</b><span>${b.day} de ${mes[b.month-1]}</span></div>
      <div class="tag">${b.days===0 ? '¡Hoy!' : esc(relDays(b.days))}</div></div>`).join('') + '</div>';
}

function renderMembers(list, src){
  const el = $('mb');
  const pill = src === 'error' ? '<span class="pill off">Sin conexión</span>' : '';
  const items = (list || []).slice(0, CONFIG.maxMembers);
  if (!items.length){
    el.innerHTML = head('userplus','Últimos miembros', pill) +
      `<div class="empty"><div>${src==='off' ? 'Notion no configurado' : src==='error' ? 'No se pudo leer Notion' : 'Aún no hay miembros para mostrar'}</div></div>`;
    return;
  }
  el.innerHTML = head('userplus','Últimos miembros', pill) + '<div class="rows">' + items.map(m => `
    <div class="row">
      <div class="av">${esc(initials(m.name))}</div>
      <div class="n"><b>${esc(m.name)}</b><span>Se unió ${esc(ago(m.joined))}</span></div>
      <div class="tag">${esc(m.role || 'Miembro')}</div></div>`).join('') + '</div>';
}

function renderStatus(){
  const s = (DATA && DATA.sources) || {};
  const item = (label, st) => `<span class="${st==='ok' ? 'ok' : st==='error' ? 'err' : ''}"><i></i>${label}</span>`;
  const bridge = DEMO ? '' : item('Puente', BRIDGE_OK ? 'ok' : 'error');
  $('status').innerHTML = bridge + item('Música', s.music) + item('Contador', s.room) + item('Calendario', s.calendar) + item('Notion', s.notion) +
    `<span>Actualizado ${fmtParts(new Date(), {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false})}</span>`;
}

function render(){
  const d = DATA, s = d.sources || {};
  $('demoBadge').classList.toggle('on', DEMO);
  renderMusic(d.music, s.music);
  renderRoom(d.room, s.room);
  renderEvents(d.events, s.calendar);
  renderBirthdays(d.birthdays, s.notion);
  renderMembers(d.members, s.notion);
  renderStatus();
}

/* ------------------------------ carga de datos ------------------------------ */
async function load(){
  try{
    const r = await fetch(CONFIG.endpoint, {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json(); DEMO = false; BRIDGE_OK = true;
  }catch(e){
    BRIDGE_OK = false;
    if (!DATA || DEMO){ DATA = demoData(); DEMO = true; }   // sin puente: ejemplo; con puente caído: se conserva lo último
  }
  render();
}

/* ------------------------------ reloj, escala y mantenimiento ------------------------------ */
function tickClock(){
  const n = new Date();
  $('time').textContent = fmtParts(n, {hour:'2-digit', minute:'2-digit', hour12:false});
  $('date').textContent = cap(fmtParts(n, {weekday:'long', day:'numeric', month:'long'}));
  tickProgress();
  const hm = fmtParts(n, {hour:'2-digit', minute:'2-digit', hour12:false});
  if (hm === CONFIG.reloadAt && !sessionStorageFlag()) location.reload();
}
function sessionStorageFlag(){ try{ if (sessionStorage.getItem('rl') === dayKey(new Date())) return true; sessionStorage.setItem('rl', dayKey(new Date())); }catch(e){} return false; }

let shift = [0,0];
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  $('stage').style.transform = `translate(${(innerWidth-1920*s)/2 + shift[0]*s}px,${(innerHeight-1080*s)/2 + shift[1]*s}px) scale(${s})`;
}
addEventListener('resize', fit); fit();
// Desplazamiento mínimo cada 5 min para cuidar paneles OLED
setInterval(() => { shift = [Math.round(Math.random()*6-3), Math.round(Math.random()*6-3)]; fit(); }, 300000);
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F'){ try{ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }catch(_){} } });

tickClock(); setInterval(tickClock, 1000);
load(); setInterval(load, CONFIG.pollMs);
</script>
</body>
</html>
